<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - CampusBite</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <nav id="navbar"></nav>
  <main class="container auth-page">
    <section class="card form-card auth-card">
      <h1>Welcome back</h1>
      <p class="muted">Log in to continue to CampusBite.</p>
      <div id="msg" class="msg" role="alert" aria-live="polite"></div>
      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <button class="btn" type="submit">Login</button>
      </form>
      <a class="btn btn-secondary" href="register.html">Register</a>
    </section>

    <div class="card form-card">
      <h3>Demo Accounts</h3>
      <p>Password for all: password123</p>
      <ul>
        <li>Customer: customer@campusbite.com</li>
        <li>Owner: owner1@campusbite.com/owner2@campusbite.com</li>
        <li>Delivery: delivery1@campusbite.com/delivery2@campusbite.com</li>
      </ul>
    </div>
  </main>

  <script type="module" src="js/pages/login.js"></script>
</body>

</html>
