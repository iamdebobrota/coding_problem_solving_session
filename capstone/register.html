<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - CampusBite</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav id="navbar"></nav>
    <main class="container auth-page">
      <section class="card form-card auth-card">
        <h1>Create an account</h1>
        <p class="muted">Register to order from CampusBite.</p>
        <div id="msg" class="msg" role="alert" aria-live="polite"></div>
        <form id="register-form">
          <label for="full-name">Full name</label>
          <input id="full-name" name="full_name" type="text" autocomplete="name" required />

          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />

          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />

          <label for="confirm-password">Confirm password</label>
          <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required />

          <button class="btn" type="submit">Register</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
      </section>
    </main>
    <script type="module" src="js/pages/register.js"></script>
  </body>
</html>
