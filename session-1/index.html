
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Repository Explorer</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>GitHub Repository Explorer</h1>

    <div class="search-box">
      <input
        type="text"
        id="usernameInput"
        placeholder="Enter GitHub username"
      />

      <button id="searchBtn">
        Search
      </button>
    </div>

    <!-- Status messages and repository cards -->
    <div id="message"></div>

    <div id="repoContainer"></div>

    <!-- Bonus: Show More -->
    <button id="showMoreBtn" class="hidden">
      Show More
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
